name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Coverage tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build CLI
        run: cargo build --locked --release
      - name: Unit and CLI integration tests
        run: cargo test --locked --all-targets --all-features
      - name: CLI smoke test
        run: cargo run --locked --release -- --help
      - name: End-to-end migration examples
        run: python -c "import os, pathlib, subprocess, sys; binary = pathlib.Path('target/release/test-evidence' + ('.exe' if os.name == 'nt' else '')); subprocess.run([sys.executable, 'examples/verify.py', str(binary)], check=True)"

  coverage:
    name: Total and changed-line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust and coverage tool
        run: |
          rustup show
          cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Measure library and CLI subprocess coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --locked --all-targets --all-features --lcov --output-path coverage/rust.lcov
      - name: Enforce both 95% thresholds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree --stdin </dev/null)
          fi
          python3 scripts/check_coverage.py --base "$BASE_SHA" \
            --report coverage/rust.lcov . --total-min 95 --changed-min 95 \
            --json-output coverage/summary.json
      - name: Keep coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: ci-gate
    if: always()
    needs: [tooling, rust, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs must succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              print(f"Required jobs did not succeed: {failed}", file=sys.stderr)
              sys.exit(1)
          print("Builds, static checks, tests, and both coverage gates passed.")
          PY
